<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Special Day | Daypedia</title>
<meta name="description" content="Discover the meaning, background and facts behind special days on Daypedia.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link id="canonical" rel="canonical" href="https://daypedia.vercel.app/">
<meta name="theme-color" content="#07091b">
<meta property="og:type" content="article"><meta id="ogTitle" property="og:title" content="Special Day | Daypedia">
<meta id="ogDescription" property="og:description" content="Discover special days on Daypedia."><meta id="ogUrl" property="og:url" content="https://daypedia.vercel.app/">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/svg+xml" href="/assets/falcon-mark.svg">
<link rel="stylesheet" href="/styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.detail-wrap{max-width:900px;margin:0 auto;padding:42px 22px 70px}.detail-nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.detail-hero{padding:clamp(22px,5vw,46px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(140deg,rgba(18,23,57,.96),rgba(9,13,34,.96));box-shadow:var(--shadow)}.detail-kicker{color:#bba4ff;text-transform:uppercase;font-size:.72rem;letter-spacing:.13em;font-weight:800}.detail-emoji{font-size:3.2rem;margin:14px 0}.detail-hero h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.08;letter-spacing:-.055em;margin-bottom:14px}.detail-date{color:var(--muted);font-size:.9rem}.detail-lead{font-size:1.08rem;line-height:1.8;color:var(--muted);margin-top:20px;max-width:70ch}.detail-section{margin-top:24px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--card)}.detail-section h2{font-size:1.2rem;margin-bottom:9px}.detail-section p{color:var(--muted);line-height:1.8}.detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.detail-save-btn{display:inline-flex;align-items:center;padding:11px 16px;border-radius:999px;border:1px solid #9e72ed66;background:#8b5cf61a;color:#d8b9ff;font-size:.82rem;font-weight:800}.detail-actions a{display:inline-flex;padding:11px 16px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:700}.detail-actions .primary{background:linear-gradient(110deg,#6539ef,#a337f4 60%,#d643e8);border:0;color:white}.detail-related{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:14px}.detail-related a{display:block;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font-weight:600;font-size:.85rem}.detail-source-note{font-size:.75rem;color:var(--muted);margin-top:10px}.verification-section{padding:18px 20px}.verification-section h2{margin-bottom:5px}.verification-section p{font-size:.84rem}.verify-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.verify-actions a{display:inline-flex;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:#cbb5ff;font-size:.78rem;font-weight:800}.verification-section .official-source-list{margin-top:12px}.verification-section .official-source-list a{font-size:.8rem}.official-source-list{display:flex;flex-direction:column;gap:9px;margin-top:14px}.official-source-list a{color:#cbb5ff;text-decoration:underline;text-underline-offset:3px;font-weight:700;font-size:.88rem}.detail-error{padding:45px;text-align:center}
@media(max-width:520px){.detail-wrap{padding:26px 15px 55px}.detail-section{padding:18px}.detail-hero{padding:23px}}
</style>
</head>
<body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
<main class="detail-wrap" id="detailRoot"><p class="detail-error">Loading this special day…</p></main>
<script>
const slug=decodeURIComponent(new URLSearchParams(location.search).get("slug")||location.pathname.split("/").filter(Boolean).pop()||"");
const cleanSlug=s=>String(s||"").normalize("NFD").replace(/[\\u0300-\\u036f]/g,"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"special-day";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const categories={festival:"Festival & celebration",awareness:"Awareness day",international:"International day",national:"National day",fun:"Fun & quirky day",food:"Food day"};
(async()=>{
 try{
  const response=await fetch("/days.json");if(!response.ok)throw new Error("Data unavailable");
  const days=await response.json();const entry=days.find(d=>cleanSlug(d.name)===slug);
  if(!entry){document.title="Day not found | Daypedia";document.querySelector('meta[name="robots"]').content="noindex,follow";document.querySelector("#detailRoot").innerHTML='<section class="detail-section detail-error"><h1>Day not found</h1><p>This observance could not be found in the Daypedia calendar.</p><p><a class="text-link" href="/">Return to Daypedia →</a></p></section>';return;}
  const url="https://daypedia.vercel.app/day/"+cleanSlug(entry.name)+"/";
  const title=entry.name+": Meaning, History & Facts | Daypedia";
  const description=String(entry.why_en||("Learn about "+entry.name+" and its significance.")).slice(0,155);
  document.title=title;document.querySelector('meta[name="description"]').content=description;
  document.querySelector("#canonical").href=url;document.querySelector("#ogTitle").content=title;document.querySelector("#ogDescription").content=description;document.querySelector("#ogUrl").content=url;
  const date=new Date(Date.UTC(2026,Number(entry.d.slice(0,2))-1,Number(entry.d.slice(3,5)),6)).toLocaleDateString("en-US",{month:"long",day:"numeric",timeZone:"UTC"});
  const officialSources={
   "World Health Day":[["World Health Organization","https://www.who.int/campaigns/world-health-day"]],
   "World Environment Day":[["UN Environment Programme","https://www.unep.org/events/un-day/world-environment-day-2026"],["UNESCO","https://www.unesco.org/en/days/environment"]],
   "World AIDS Day":[["World Health Organization","https://www.who.int/campaigns"]],
   "World Mental Health Day":[["World Health Organization","https://www.who.int/campaigns"]],
   "World Water Day":[["United Nations","https://www.un.org/en/observances/water-day"]],
   "International Women's Day":[["United Nations","https://www.un.org/en/observances/womens-day"]],
   "Human Rights Day":[["United Nations","https://www.un.org/en/observances/human-rights-day"]],
   "International Day of Peace":[["United Nations","https://www.un.org/en/observances/international-day-peace"]],
   "World Children's Day":[["UNICEF","https://www.unicef.org/world-childrens-day"]],
   "World Food Day":[["Food and Agriculture Organization","https://www.fao.org/world-food-day/en"]],
   "World Oceans Day":[["United Nations","https://www.un.org/en/observances/oceans-day"]],
   "World Book Day":[["UNESCO","https://www.unesco.org/en/days/world-book-and-copyright-day"]]
  };
  const sources=officialSources[entry.name]||((entry.cat==="international")?[["United Nations observances directory","https://www.un.org/en/observances/international-days-and-weeks"]]:entry.cat==="awareness"?[["World Health Organization campaigns","https://www.who.int/campaigns"]]:[]);
  const related=days.filter(d=>d.cat===entry.cat&&d.name!==entry.name).slice(0,4);
  const article={"@context":"https://schema.org","@type":"Article","headline":entry.name+" | Daypedia","description":description,"mainEntityOfPage":url,"author":{"@type":"Organization","name":"Daypedia","url":"https://daypedia.vercel.app/"},"publisher":{"@type":"Organization","name":"Daypedia","url":"https://daypedia.vercel.app/"}};
  const crumb={"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://daypedia.vercel.app/"},{"@type":"ListItem","position":2,"name":entry.name,"item":url}]};
  for(const data of [article,crumb]){const script=document.createElement("script");script.type="application/ld+json";script.textContent=JSON.stringify(data);document.head.appendChild(script);}
  document.querySelector("#detailRoot").innerHTML='<nav class="detail-nav"><a class="brand" href="/"><span class="brand-mark"><img src="/assets/falcon-mark.svg" alt="" width="30" height="30"></span><span>Daypedia</span></a><a class="text-link" href="/">← Back to calendar</a></nav><article><header class="detail-hero"><div class="detail-kicker">'+esc(categories[entry.cat]||"Special day")+' · '+esc(date)+'</div><div class="detail-emoji" aria-hidden="true">'+esc(entry.emoji||"✦")+'</div><h1>'+esc(entry.name)+'</h1><p class="detail-date">Observed on '+esc(date)+' each year</p><p class="detail-lead">'+esc(entry.why_en||"Discover this observance and learn more about its significance.")+'</p><div class="detail-actions"><button type="button" id="detailSaveDay" class="detail-save-btn">♡ Save this day</button><a class="primary" href="https://www.instagram.com/days_pedia/" target="_blank" rel="noopener noreferrer">Follow @days_pedia ↗</a><a href="/">Browse Daypedia</a></div></header><section class="detail-section"><h2>Why is '+esc(entry.name)+' observed?</h2><p>'+esc(entry.why_en||"Details will be added after review.")+'</p></section><section class="detail-section"><h2>Who observes '+esc(entry.name)+'?</h2><p>'+esc(entry.who_en||"The observance may be recognized by communities or organizations in different regions.")+'</p></section><section class="detail-section"><h2>Did you know?</h2><p>'+esc(entry.fact_en||"More facts will be added after review.")+'</p></section><section class="detail-section"><h2>Explore related days</h2><p>Discover more observances from the Daypedia calendar.</p><div class="detail-related">'+related.map(d=>'<a href="/day/'+cleanSlug(d.name)+'/">'+esc(d.emoji||"✦")+' '+esc(d.name)+' ↗</a>').join("")+'</div></section><section class="detail-section verification-section"><h2>Verify this day</h2><p>Cross-check the details with another source.</p><div class="verify-actions"><a href="https://www.google.com/search?q='+encodeURIComponent(entry.name+' observance date history')+'" target="_blank" rel="noopener noreferrer">Search Google ↗</a><a href="https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(entry.name)+'" target="_blank" rel="noopener noreferrer">Search Wikipedia ↗</a></div>'+ (sources.length?'<ul class="official-source-list">'+sources.map(s=>'<li><a href="'+esc(s[1])+'" target="_blank" rel="noopener noreferrer">'+esc(s[0])+' ↗</a></li>').join("")+'</ul>':'<p class="detail-source-note">No dedicated reference is listed yet. Use the searches above to cross-check details.</p>')+'<p class="detail-source-note">Dates and traditions may vary by country or community.</p></section></article><footer class="footer"><a class="brand footer-brand" href="/"><span class="brand-mark"><img src="/assets/falcon-mark.svg" alt="" width="25" height="25"></span><span>Daypedia</span></a><p>Made for curious minds. Every day has a story.</p><a href="https://www.instagram.com/days_pedia/" target="_blank" rel="noopener noreferrer">@days_pedia ↗</a></footer>';
 }catch(error){document.querySelector("#detailRoot").innerHTML='<section class="detail-section detail-error"><h1>Could not load this day</h1><p>Please return to the calendar and try again.</p><a href="/">Back to Daypedia</a></section>';}
})();
</script></body></html>
